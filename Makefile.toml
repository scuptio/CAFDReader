# 根任务只编排，构建逻辑位于项目脚本与 Tauri 中。
[config]
skip_core_tasks = true
skip_git_env_info = true
skip_crate_env_info = true
min_version = "0.37.24"

[tasks.default]
alias = "help"

[tasks.help]
description = "List project tasks; reader: cargo make reader [platform] [--plan]"
category = "Help"
command = "node"
args = ["scripts/python.mjs", "--cargo-make", "scripts/show_tasks.py", "${@}"]

[tasks.doctor]
description = "Check the reader toolchain without changes: doctor [platform]"
category = "Help"
command = "node"
args = ["scripts/reader.mjs", "--doctor", "${@}"]

[tasks.setup-android]
description = "Set up Android tools (Ubuntu/Windows x64); --plan previews, --yes accepts SDK licenses"
category = "Development"
command = "node"
args = ["scripts/python.mjs", "--cargo-make", "scripts/setup_android.py", "${@}"]

[tasks.reader]
description = "Build the reader: reader [linux|windows|macos|web|android|ios]; defaults to the host desktop"
category = "Build"
command = "node"
args = ["scripts/reader.mjs", "${@}"]

[tasks.build]
description = "Alias for reader; builds for the host desktop by default"
category = "Build"
alias = "reader"

[tasks.dev]
description = "Start the development reader: dev [platform]; use static HTTP for web"
category = "Development"
command = "node"
args = ["scripts/reader.mjs", "--dev", "${@}"]


[tasks.test-unit]
description = "Check protocols, platform routing and Web module boundaries"
category = "Test"
command = "node"
args = ["scripts/test.mjs", "unit", "${@}"]

[tasks.test-rust]
dependencies = ["build-web"]
description = "Run native host Rust tests"
category = "Test"
command = "cargo"
args = ["test", "--manifest-path", "src-tauri/Cargo.toml", "--locked", "${@}"]

[tasks.test]
description = "Run basic checks and native Rust tests in sequence"
category = "Test"
dependencies = ["test-unit", "test-rust"]



[tasks.test-browser]
description = "Run browser regression tests; requires static HTTP and Chrome"
category = "Test"
command = "node"
args = ["scripts/test.mjs", "browser", "${@}"]

[tasks.test-native]
description = "Verify native WebView reopening; accepts --binary, --book and --report"
category = "Test"
command = "node"
args = ["scripts/python.mjs", "--cargo-make", "scripts/test_native_reader.py", "${@}"]

[tasks.fixtures]
description = "Rebuild independent protocol fixtures; requires the rustc WASM target and CAF_TOOL"
category = "Development"
command = "node"
args = ["scripts/python.mjs", "--cargo-make", "scripts/build_fixtures.py", "${@}"]

[tasks.build-web]
private = true
command = "node"
args = ["scripts/build_host.mjs"]
