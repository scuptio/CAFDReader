<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>CAFD Reader</title>
  <link rel="stylesheet" href="about.css" />
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:0;background:#f4ecd8;color:#2b2620;font-family:serif;text-align:center}
    h1{font-size:22px;font-weight:500;letter-spacing:.15em}#shelf{display:flex;flex-wrap:wrap;justify-content:center;gap:32px;margin:40px auto;max-width:1000px}
    article{width:280px;padding:24px;background:#eadfc2;border:1px solid #c9b893;text-align:left}h2{font-size:20px;font-weight:500;line-height:1.8}p{font-size:13px;line-height:1.8;color:#6b5f4d}a{color:#9e3b2b}small{display:block;margin-top:18px;overflow-wrap:anywhere;color:#6b5f4d;font-size:11px}
    .cover-link{display:flex;align-items:center;justify-content:center;height:260px;background:#fff;border:1px solid #c9b893;overflow:hidden}.book-cover{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.cover-link:focus-visible{outline:2px solid #9e3b2b;outline-offset:4px}
    .remove-book{display:block;margin-top:16px;padding:6px 10px;border:1px solid #c9b893;background:#f8f1df;color:#9e3b2b;cursor:pointer}.remove-book:disabled{opacity:.6;cursor:wait}
  </style>
</head>
<body>
  <header class="app-topbar shelf-topbar">
    <a class="app-brand" href="./">CAFD Reader</a>
    <details id="readerMenu" class="reader-menu">
        <summary><span class="menu-label" data-i18n="设置与帮助">设置与帮助</span><span class="menu-icon" aria-hidden="true">⋯</span></summary>
        <div class="reader-menu-panel">
          <p class="menu-heading" data-i18n="阅读器设置">阅读器设置</p>
          <label class="language-setting"><span data-i18n="界面语言">界面语言</span><select id="uiLanguage"><option value="zh-CN">中文</option><option value="en">English</option></select></label>
          <span id="languageStatus" role="status"></span>
          <button id="btnAbout" type="button" aria-haspopup="dialog"><span data-i18n="关于阅读器">关于阅读器</span><span aria-hidden="true">↗</span></button>
        </div>
      </details>
  </header>
  <main class="shelf-main">
  <h1 data-i18n="书架">书架</h1>
  <button id="btnImport" hidden data-i18n="导入 .cafd">导入 .cafd</button>
  <div id="shelf" aria-label="书架"></div>
  <p id="shelfStatus" role="status" data-i18n="正在载入书架…">正在载入书架…</p>
  <p><a href="reader/" data-i18n="打开本地 .cafd 档案">打开本地 .cafd 档案</a></p>
  </main>
  <script type="module" src="shelf.js"></script>
  <script type="module" src="about.js"></script>
</body>
</html>
