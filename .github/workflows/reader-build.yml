name: 跨平台阅读器验证构建
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-setup-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: 验证安装边界与平台参数（不安装系统依赖）
        run: node tests/android-setup.spec.mjs
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf xvfb
      - run: cargo install cargo-make --version 0.37.24 --locked
      - run: npm ci
      - run: cargo make test
      - run: cargo make reader
      - name: 原生 WebKit 验收与重开持久性
        run: xvfb-run -a cargo make test-native -- --binary src-tauri/target/release/cafd-reader --book tests/fixtures/reader.cafd --report native-validation.json
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cafd-reader-linux
          path: |
            src-tauri/target/release/bundle/**/*.deb
            native-validation.json
          if-no-files-found: error
  desktop:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-make --version 0.37.24 --locked
      - run: npm ci
      - run: cargo make test
      - run: cargo make reader
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cafd-reader-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
  android:
    needs: [desktop, android-setup-checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-make --version 0.37.24 --locked
      - run: npm ci
      - name: 安装项目锁定的 Android 工具链
        run: cargo make setup-android -- --yes --skip-system --skip-npm
      - run: cargo make reader android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cafd-reader-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
