name: Reader Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      timestamp: ${{ steps.version.outputs.timestamp }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: 校验程序版本并统一生成 UTC 构建编号
        id: version
        env:
          SOURCE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: node scripts/release.mjs metadata "$SOURCE_TAG" >> "$GITHUB_OUTPUT"

  desktop:
    name: ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            platform: windows
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
            suffix: windows-x64-setup.exe
          - os: ubuntu-22.04
            label: linux (ubuntu)
            platform: linux
            target: x86_64-unknown-linux-gnu
            bundle: deb
            extension: deb
            suffix: ubuntu-x64.deb
          - os: macos-15-intel   # macos-latest(arm64)容量紧张时改用 Intel 池;universal 构建在两架构上均可(此标签 2027-08 退役后回到 macos-latest)
            label: macos
            platform: macos
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: dmg
            extension: dmg
            suffix: macos-universal.dmg
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_TIMESTAMP: ${{ needs.validate.outputs.timestamp }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUNDLE: ${{ matrix.bundle }}
      EXTENSION: ${{ matrix.extension }}
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || matrix.target }}
      - name: 安装 Linux 构建及验收依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf xvfb
      - run: cargo install cargo-make --version 0.37.24 --locked
      - run: npm ci
      - run: cargo make test
      - run: cargo make reader "$BUILD_PLATFORM" -- --target "$BUILD_TARGET" --bundles "$BUNDLE"
      - name: Linux 原生重开验收
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo make test-native -- --binary "src-tauri/target/$BUILD_TARGET/release/cafd-reader" --book tests/fixtures/reader.cafd --report build/release-native-validation.json
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      - name: 收集唯一安装包
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/"$BUILD_TARGET"/release/bundle/"$BUNDLE"/*."$EXTENSION")
          test "${#packages[@]}" -eq 1
          mkdir -p release-assets
          cp "${packages[0]}" "release-assets/cafd-reader-$VERSION-$BUILD_TIMESTAMP-$SUFFIX"
      # Keep artifact actions compatible with act; see docs/en/releasing.md.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_TIMESTAMP: ${{ needs.validate.outputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-make --version 0.37.24 --locked
      - run: npm ci
      - run: cargo make test-unit
      - run: cargo make setup-android -- --yes --skip-system --skip-npm
      - run: cargo make reader android --release
      # zipalign must run before apksigner; the keystore lives only in a temp dir. Under act
      # without signing secrets, a throwaway keystore keeps the pipeline verifiable.
      - name: 对齐、签名并收集正式 APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          source build/android-env.sh
          tools="$ANDROID_HOME/build-tools/$(node -p "JSON.parse(require('fs').readFileSync('config/android-toolchain.json')).build_tools")"
          mapfile -d '' packages < <(find src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*-unsigned.apk' -print0)
          test "${#packages[@]}" -eq 1
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          "$tools/zipalign" -P 16 -f 4 "${packages[0]}" "$workdir/aligned.apk"
          "$tools/zipalign" -c -P 16 4 "$workdir/aligned.apk"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            base64 -d <<<"$ANDROID_KEYSTORE_BASE64" > "$workdir/keystore.jks"
          elif [[ "${ACT:-}" == "true" ]]; then
            echo "::warning::缺少签名 Secrets,act 本地运行改用一次性密钥库,仅验证流程,产物不得分发"
            ANDROID_KEYSTORE_PASSWORD='act-throwaway'
            ANDROID_KEY_PASSWORD='act-throwaway'
            ANDROID_KEY_ALIAS='act'
            keytool -genkeypair -keystore "$workdir/keystore.jks" -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=act" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD"
          else
            echo '缺少签名 Secrets:ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS' >&2
            exit 1
          fi
          mkdir -p release-assets
          apk="release-assets/cafd-reader-$VERSION-$BUILD_TIMESTAMP-android-arm64.apk"
          "$tools/apksigner" sign --ks "$workdir/keystore.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$apk" "$workdir/aligned.apk"
          "$tools/apksigner" verify --print-certs "$apk"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-android
          path: release-assets/*.apk
          if-no-files-found: error

  web:
    needs: validate
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_TIMESTAMP: ${{ needs.validate.outputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Web 宿主构建是纯 Node/esbuild 组装,直接调用脚本,不编译 cargo-make。
      - run: node scripts/build_host.mjs
      - run: node scripts/test.mjs unit
      - name: 打包 Web 宿主产物
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/cafd-reader-web-$VERSION-$BUILD_TIMESTAMP.tar.gz" -C dist-host .
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-web
          path: release-assets/*.tar.gz
          if-no-files-found: error

  release:
    needs: [validate, desktop, android, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_TITLE: ${{ needs.validate.outputs.title }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: 校验全平台产物并生成 SHA-256 清单
        run: node scripts/release.mjs checksums "$RELEASE_TAG" release-assets
      - name: 创建 Release 草稿，留待人工公开
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=()
          if [[ "$VERSION" == *-* ]]; then options+=(--prerelease); fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft \
            --title "$RELEASE_TITLE" --generate-notes "${options[@]}"
